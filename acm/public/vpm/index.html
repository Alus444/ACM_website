<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090b" />
    <title>ACM VPM Repository</title>
    <style>
      :root {
        font-family:
          Inter, "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", sans-serif;
        color: #f4f5f7;
        background: #08090b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at 50% 0%, rgba(93, 110, 145, 0.2), transparent 42%),
          #08090b;
      }

      main {
        width: min(640px, 100%);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #2a2d34;
        border-radius: 18px;
        background: rgba(15, 17, 21, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #aeb4c0;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1.05;
        letter-spacing: -0.035em;
      }

      .lead {
        margin: 22px 0 0;
        color: #c9cdd5;
        line-height: 1.8;
      }

      .add-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 56px;
        margin-top: 30px;
        padding: 14px 20px;
        border-radius: 10px;
        color: #08090b;
        background: #f4f5f7;
        font-weight: 800;
        text-decoration: none;
        transition:
          transform 140ms ease,
          background-color 140ms ease;
      }

      .add-button:hover {
        transform: translateY(-1px);
        background: #ffffff;
      }

      .add-button:focus-visible,
      .copy-button:focus-visible {
        outline: 3px solid #94b4ff;
        outline-offset: 3px;
      }

      .note {
        margin: 14px 0 0;
        color: #8f96a3;
        font-size: 0.84rem;
        line-height: 1.65;
      }

      .manual {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid #292c32;
      }

      .manual h2 {
        margin: 0 0 12px;
        font-size: 0.95rem;
      }

      .repo-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      code {
        min-width: 0;
        overflow-x: auto;
        padding: 12px 14px;
        border: 1px solid #2a2e36;
        border-radius: 8px;
        color: #d8dce4;
        background: #0a0c0f;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 0.78rem;
        white-space: nowrap;
      }

      .copy-button {
        padding: 0 16px;
        border: 1px solid #353a44;
        border-radius: 8px;
        color: #e7e9ee;
        background: #1a1d23;
        cursor: pointer;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 700;
      }

      @media (max-width: 480px) {
        .repo-row {
          grid-template-columns: 1fr;
        }

        .copy-button {
          min-height: 42px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">ACM VPM Repository</p>
      <h1>ACM Editor Tools</h1>
      <p class="lead">
        Unity向けACM Editor拡張を、VCCまたはALCOMからインストールできます。
      </p>

      <a
        class="add-button"
        href="vcc://vpm/addRepo?url=https%3A%2F%2Fac-md.com%2Fvpm%2Findex.json"
      >
        VCC / ALCOM に追加
      </a>
      <p class="note">
        クリックすると、この端末で <code>vcc:</code> に関連付けられているVCCまたはALCOMが開きます。登録前にはアプリ側の確認画面が表示されます。
      </p>

      <section class="manual" aria-labelledby="manual-heading">
        <h2 id="manual-heading">手動で追加する場合</h2>
        <div class="repo-row">
          <code id="repo-url">https://ac-md.com/vpm/index.json</code>
          <button class="copy-button" id="copy-button" type="button">コピー</button>
        </div>
      </section>
    </main>

    <script>
      const copyButton = document.querySelector("#copy-button");
      const repositoryUrl = document.querySelector("#repo-url").textContent;

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(repositoryUrl);
          copyButton.textContent = "コピーしました";
        } catch {
          copyButton.textContent = "コピーできませんでした";
        }

        window.setTimeout(() => {
          copyButton.textContent = "コピー";
        }, 1800);
      });
    </script>
  </body>
</html>
